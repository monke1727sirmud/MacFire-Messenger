name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (${{ matrix.configuration }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain and schemes
        run: |
          xcodebuild -version
          xcrun ibtool --version
          xcodebuild -project MacFire.xcodeproj -list

      - name: Build MacFire (${{ matrix.configuration }})
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath build-${{ matrix.configuration }} \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-${{ matrix.configuration }}.log

      - name: Analyze MacFire
        if: matrix.configuration == 'Debug'
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee analyze.log
          findings=$(grep -Ec ':[0-9]+:[0-9]+: (warning|error):' analyze.log || true)
          if [ "$findings" -gt 0 ]; then
            echo "::error::Clang static analyzer reported ${findings} finding(s); see the analyze.log artifact."
            grep -m 20 -E ':[0-9]+:[0-9]+: (warning|error):' analyze.log
            exit 1
          fi

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ matrix.configuration }}
          path: |
            build-${{ matrix.configuration }}.log
            analyze.log
          if-no-files-found: ignore
