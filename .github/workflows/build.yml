name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain and schemes
        run: |
          xcodebuild -version
          xcrun ibtool --version
          xcodebuild -project MacFire.xcodeproj -list

      - name: Build MacFire
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
