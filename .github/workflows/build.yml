name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (${{ matrix.configuration }})
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Pinned so CI results don't change when the runner image's default
      # Xcode moves. Must be one of the Xcode versions installed on macos-15.
      XCODE_VERSION: "16.4"
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner. Installed versions:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode_app"
          xcodebuild -version

      - name: Show toolchain and schemes
        run: |
          xcodebuild -version
          xcrun ibtool --version
          xcodebuild -project MacFire.xcodeproj -list

      - name: Build MacFire (${{ matrix.configuration }})
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath build-${{ matrix.configuration }} \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-${{ matrix.configuration }}.log

      - name: Verify app bundle
        run: |
          set -euo pipefail
          app="build-${{ matrix.configuration }}/Build/Products/${{ matrix.configuration }}/MacFire.app"
          resources="$app/Contents/Resources"
          fail=0

          check_file() {
            if [ -e "$1" ]; then
              echo "ok: $1"
            else
              echo "::error::missing $1"
              fail=1
            fi
          }

          has_resource() {
            find "$resources" -name "$1" -print -quit | grep -q .
          }

          check_file "$app/Contents/MacOS/MacFire"
          if [ -x "$app/Contents/MacOS/MacFire" ]; then
            echo "ok: executable bit set"
          else
            echo "::error::Contents/MacOS/MacFire is not executable"
            fail=1
          fi

          check_file "$app/Contents/Info.plist"
          if plutil -lint "$app/Contents/Info.plist"; then
            echo "ok: Info.plist parses"
          else
            echo "::error::Info.plist is not a valid plist"
            fail=1
          fi

          for nib in MainMenu ChatWindow MFMainWindow PreferencesWindow \
                     FriendshipRequestWindow UserSearchWindow XfirePrefsWindow; do
            if has_resource "$nib.nib"; then
              echo "ok: $nib.nib"
            else
              echo "::error::missing $nib.nib in Contents/Resources"
              fail=1
            fi
          done

          if has_resource "MacFire.icns"; then
            echo "ok: MacFire.icns"
          else
            echo "::error::missing MacFire.icns in Contents/Resources"
            fail=1
          fi

          echo "---- otool -L ----"
          links=$(otool -L "$app/Contents/MacOS/MacFire")
          printf '%s\n' "$links"
          if printf '%s\n' "$links" | grep -iq 'growl'; then
            echo "::error::MacFire still links Growl"
            fail=1
          fi
          if printf '%s\n' "$links" | grep -q 'libcrypto'; then
            echo "::error::MacFire still links libcrypto"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "bundle verification passed"

      - name: Test MacFire
        if: matrix.configuration == 'Debug'
        run: |
          set -euo pipefail
          rm -rf test.xcresult
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-Debug \
            -resultBundlePath test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

          xcrun xcresulttool get test-results summary --path test.xcresult > test-summary.json
          cat test-summary.json
          python3 - <<'PY'
          import json, sys

          summary = json.load(open("test-summary.json"))
          total = summary.get("totalTestCount", 0)
          passed = summary.get("passedTests", 0)
          failed = summary.get("failedTests", 0)
          skipped = summary.get("skippedTests", 0)
          print(f"executed {total} test(s): {passed} passed, {failed} failed, {skipped} skipped")
          if total == 0:
              print("::error::No tests ran. MacFireTests built but no test case was loaded; failing the job instead of reporting a green run.")
              sys.exit(1)
          PY

      - name: Analyze MacFire
        if: matrix.configuration == 'Debug'
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee analyze.log
          # Compiler diagnostics carry their warning flag ([-Wdeprecated-declarations]
          # etc.); analyzer findings carry a checker name ([unix.Malloc]) or no
          # flag at all. Keep only the latter so deprecation warnings stay green.
          grep -E ':[0-9]+:[0-9]+: (warning|error): ' analyze.log \
            | grep -Ev '\[-W[A-Za-z0-9_,-]+\][[:space:]]*$' > analyzer-findings.txt || true
          if [ -s analyzer-findings.txt ]; then
            findings=$(wc -l < analyzer-findings.txt | tr -d ' ')
            echo "::error::Clang static analyzer reported ${findings} finding(s); see analyzer-findings.txt and analyze.log."
            sed -n '1,20p' analyzer-findings.txt
            exit 1
          fi

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ matrix.configuration }}
          path: |
            build-${{ matrix.configuration }}.log
            analyze.log
            analyzer-findings.txt
            test.log
            test-summary.json
            test.xcresult
          if-no-files-found: ignore
