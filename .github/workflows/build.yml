name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (${{ matrix.configuration }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain and schemes
        run: |
          xcodebuild -version
          xcrun ibtool --version
          xcodebuild -project MacFire.xcodeproj -list

      - name: Build MacFire (${{ matrix.configuration }})
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath build-${{ matrix.configuration }} \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-${{ matrix.configuration }}.log

      - name: Analyze MacFire
        if: matrix.configuration == 'Debug'
        run: |
          set -o pipefail
          xcodebuild \
            -project MacFire.xcodeproj \
            -scheme MacFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee analyze.log
          # Compiler diagnostics carry their warning flag ([-Wdeprecated-declarations]
          # etc.); analyzer findings carry a checker name ([unix.Malloc]) or no
          # flag at all. Keep only the latter so deprecation warnings stay green.
          grep -E ':[0-9]+:[0-9]+: (warning|error): ' analyze.log \
            | grep -Ev '\[-W[A-Za-z0-9_,-]+\][[:space:]]*$' > analyzer-findings.txt || true
          if [ -s analyzer-findings.txt ]; then
            findings=$(wc -l < analyzer-findings.txt | tr -d ' ')
            echo "::error::Clang static analyzer reported ${findings} finding(s); see analyzer-findings.txt and analyze.log."
            sed -n '1,20p' analyzer-findings.txt
            exit 1
          fi

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ matrix.configuration }}
          path: |
            build-${{ matrix.configuration }}.log
            analyze.log
            analyzer-findings.txt
          if-no-files-found: ignore
